<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小卡共享</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--purple:#6d28d9;--pl:#8b5cf6;--bg:#f5f0eb;--card:#fff;--text:#333;--muted:#888;--border:#e8e0d8;--danger:#dc2626;--r:12px;--rs:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh}
.nav{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--pl),var(--purple));color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav h1{font-size:16px;font-weight:600;white-space:nowrap;flex-shrink:0}
.nav-actions{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:center;max-width:calc(100% - 60px);padding-right:4px}
.nav-actions::-webkit-scrollbar{display:none}
#navUsers{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:120px}
#navUsers::-webkit-scrollbar{display:none}
#navUsers .nav-btn{max-width:70px;overflow:hidden;text-overflow:ellipsis;padding:5px 8px}
.nav-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:14px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.nav-btn.active{background:rgba(255,255,255,.35);font-weight:600}
.nav-sep{width:1px;height:16px;background:rgba(255,255,255,.25);flex-shrink:0;margin:0 2px}
.main{padding:12px 12px 16px}
.view-toggle{display:flex;background:var(--border);border-radius:10px;padding:3px;margin-bottom:12px}
.view-toggle button{flex:1;border:none;background:none;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;color:#666}
.view-toggle button.active{background:#fff;color:var(--purple);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card-item{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;display:flex;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;cursor:pointer}
.card-item:active{background:var(--tint,#faf5ff)}
.card-thumb{width:72px;height:72px;border-radius:var(--rs);flex-shrink:0;overflow:hidden;background:#f0ebe3;display:flex;align-items:center;justify-content:center}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-thumb .emoji{font-size:30px}
.card-body{flex:1;min-width:0}
.card-body h4{font-size:15px;font-weight:600;margin-bottom:2px}
.card-body .meta{font-size:12px;color:var(--muted);line-height:1.5}
.card-body .price-line{font-size:13px;font-weight:600;color:#e74c3c;margin-top:2px}
.card-delete{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.05);color:#999;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;padding:0 6px;white-space:nowrap}
.card-delete.confirming{background:#fee2e2;color:var(--danger)}
.card-edit{position:absolute;top:8px;right:40px;min-width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.05);color:#999;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;padding:0 6px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;margin-bottom:2px}
.tag-member{background:var(--tint2,#ede9fe);color:var(--purple)}
.tag-group{background:#dbeafe;color:#2563eb}
.tag-type{background:#fce7f3;color:#be185d}
.tag-series{background:#d1fae5;color:#065f46}
.tag-status{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;margin-left:4px}
.s-shipping{background:#fef3c7;color:#d97706}
.s-arrived{background:#d1fae5;color:#065f46}
.s-waiting{background:#fee2e2;color:var(--danger)}
.group-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--card);border-radius:var(--r);margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.group-hd:active{background:var(--tint,#faf5ff)}
.group-hd .gi{flex:1}
.group-hd .gn{font-size:15px;font-weight:600}
.group-hd .gm{font-size:12px;color:var(--muted)}
.group-hd .arrow{font-size:14px;color:var(--pl);min-width:20px;text-align:right;transition:transform .2s}
.group-hd.collapsed .arrow{transform:rotate(-90deg)}
.group-cards{overflow:hidden;transition:max-height .3s}
.group-cards.collapsed{max-height:0!important}
.group-cards .card-item{border-left:3px solid var(--tint2,#ede9fe);border-radius:0 var(--r) var(--r) 0}
.jump-nav{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px;-webkit-overflow-scrolling:touch}
.jump-nav::-webkit-scrollbar{display:none}
.jump-chip{flex-shrink:0;padding:7px 14px;border-radius:16px;font-size:12px;font-weight:600;background:var(--card);color:#666;border:none;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.jump-chip:active{background:var(--tint2,#ede9fe);color:var(--purple)}
.jump-chip .badge{display:inline-block;background:var(--border);color:var(--muted);font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px}
.series-block{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.series-block .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.series-block .sh h4{font-size:15px;font-weight:600}
.series-block .sh .sc{font-size:11px;color:var(--muted)}
.series-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.series-thumbs::-webkit-scrollbar{height:4px}
.series-thumbs::-webkit-scrollbar-thumb{background:#e0d8cc;border-radius:2px}
.series-thumb-item{flex-shrink:0;text-align:center;width:72px;cursor:pointer}
.series-thumb-img{width:72px;height:72px;border-radius:var(--rs);background:#f0ebe3;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:4px;overflow:hidden}
.series-thumb-img img{width:100%;height:100%;object-fit:cover;border-radius:var(--rs)}
.series-thumb-name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.album-banner{display:flex;gap:10px;overflow-x:auto;padding:12px;background:linear-gradient(135deg,var(--tint),#fff);border-radius:var(--r);margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.album-banner::-webkit-scrollbar{height:4px}
.album-banner::-webkit-scrollbar-thumb{background:#e0d8cc;border-radius:2px}
.album-banner-item{flex-shrink:0;width:120px;background:var(--card);border-radius:var(--rs);padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;position:relative}
.album-banner-item.owned{border:2px solid var(--purple)}
.album-banner-item .cover{width:100%;aspect-ratio:3/4;border-radius:6px;background:#f0ebe3;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px;overflow:hidden}
.album-banner-item .cover img{width:100%;height:100%;object-fit:cover}
.album-banner-item .title{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.album-banner-item .count{font-size:11px;color:var(--muted);margin-top:4px}
.album-banner-item .check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.album-guide-swiper{position:relative;width:100%;overflow:hidden;border-radius:var(--r);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
.album-guide-track{display:flex;transition:transform .3s ease}
.album-guide-slide{flex:0 0 100%;width:100%;height:260px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card)}
.album-guide-slide img{width:100%;height:100%;object-fit:contain;display:block}
.album-guide-dots{display:flex;justify-content:center;gap:6px;padding:10px 0}
.album-guide-dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .2s}
.album-guide-dot.active{background:var(--purple)}
.album-guide-progress{font-size:12px;color:var(--muted);text-align:center;padding-bottom:8px}
.album-guide-nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);border:none;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2}
.album-guide-nav.prev{left:8px}
.album-guide-nav.next{right:8px}
.album-guide-nav:disabled{opacity:.3;cursor:default}
.series-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.series-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;position:relative;min-height:90px;display:flex;flex-direction:column;justify-content:space-between}
.series-card .sc-name{font-size:15px;font-weight:600}
.series-card .sc-meta{font-size:12px;color:var(--muted);margin-top:6px}
.series-card .sc-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--pl);font-size:18px}
.series-detail-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.series-detail-hd .back{width:32px;height:32px;border-radius:50%;border:none;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;color:var(--purple);font-size:16px}
.series-detail-hd h3{flex:1;font-size:17px}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card-grid .cg-item{background:var(--card);border-radius:var(--rs);padding:8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.card-grid .cg-cover{width:100%;aspect-ratio:3/4;border-radius:6px;background:#f0ebe3;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:6px;overflow:hidden}
.card-grid .cg-cover img{width:100%;height:100%;object-fit:cover}
.card-grid .cg-name{font-size:11px;color:var(--text);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-grid .cg-member{font-size:10px;color:var(--muted);margin-top:2px}
.stats-bar{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-item{flex:1}
/* CORTIS 专用顶部栏 */
.cortis-top{background:var(--card);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cortis-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cortis-row .count{font-size:13px;font-weight:600;color:var(--text)}
.cortis-row .manage-actions button{padding:5px 12px;font-size:12px}
.cortis-stats{display:flex;justify-content:space-around;text-align:center;background:var(--tint2,#ede9fe);border-radius:8px;padding:8px 0}
.cortis-stats .stat-item{flex:1}
.cortis-stats .stat-num{font-size:16px;font-weight:700;color:var(--purple)}
.cortis-stats .stat-label{font-size:10px;color:var(--muted);margin-top:2px}
/* 配对创建器 */
.pair-composer{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pair-composer-label{font-size:13px;font-weight:600;margin-bottom:8px}
.pair-composer input#pairDraftLabel{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;box-sizing:border-box;margin-bottom:12px;background:#fff}
.pair-composer-cards{display:flex;gap:12px;align-items:center;justify-content:center}
.pair-slot-frame{flex:1;min-width:0;max-width:150px}
.pair-slot-empty{aspect-ratio:3/4;border:2px dashed var(--purple);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--tint2,#f3f0ff);gap:4px}
.pair-slot-empty .plus{font-size:36px;color:var(--purple);line-height:1}
.pair-slot-empty .hint{font-size:12px;color:var(--purple)}
.pair-slot-filled{aspect-ratio:3/4;border:2px solid var(--purple);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#f0ebe3}
.pair-slot-filled img{width:100%;height:100%;object-fit:cover;display:block}
.pair-slot-filled .emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}
.pair-slot-filled .swap{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.pair-slot-name{font-size:12px;color:var(--text);margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.pair-heart{font-size:24px;flex-shrink:0}
.pair-composer .btn-main{margin-top:12px}
/* 选卡网格 */
.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:60vh;overflow-y:auto;padding:2px}
.pick-item{border:1px solid var(--border);border-radius:8px;padding:4px;cursor:pointer;text-align:center;background:#fff}
.pick-item.active{border:2px solid var(--purple);padding:3px}
.pick-item .pick-thumb{aspect-ratio:1/1;overflow:hidden;background:#f0ebe3;border-radius:6px;display:flex;align-items:center;justify-content:center}
.pick-item .pick-thumb img{width:100%;height:100%;object-fit:cover}
.pick-item .pick-thumb .emoji{font-size:20px}
.pick-item .pick-name{font-size:10px;color:var(--text);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.pick-item .pick-sub{font-size:9px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.pick-thumb{position:relative}
.pick-check{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--purple);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2}
.pick-confirm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.pick-confirm .pick-hint{font-size:11px;color:var(--muted)}
.pick-confirm .btn-main{flex:0 0 auto;min-width:96px}
/* 配对区 */
.pair-section{margin-bottom:14px}
.pair-section .pair-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pair-section .pair-hd .pair-title{font-size:14px;font-weight:600}
.pair-section .pair-hd .pair-add{background:var(--tint2,#ede9fe);color:var(--purple);border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.pair-card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pair-card .pair-name{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.pair-card .pair-name .label{color:var(--pl);border-bottom:1px dashed var(--pl)}
.pair-card .pair-name .pair-del{position:absolute;right:0;background:none;border:none;color:#999;font-size:12px;cursor:pointer;padding:2px 6px}
.pair-cards{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px 10px;border-radius:14px;background:linear-gradient(135deg,#fff0f5,#ffe4ec);border:2px solid #ffb6d9;position:relative}
.pair-cards .bubble{position:absolute;font-size:15px;pointer-events:none;animation:floatHeart 2.4s ease-in-out infinite}
.pair-cards .bubble.b1{top:-8px;left:12%}
.pair-cards .bubble.b2{top:-11px;right:14%;animation-delay:.5s}
.pair-cards .bubble.b3{bottom:-8px;left:22%;animation-delay:1s}
.pair-cards .bubble.b4{bottom:-11px;right:20%;animation-delay:1.5s}
.pair-cards .bubble.b5{top:50%;left:-9px;animation-delay:.8s}
.pair-cards .bubble.b6{top:44%;right:-9px;animation-delay:1.8s}
@keyframes floatHeart{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.12)}}
.pair-cards .pair-slot{flex:1;min-width:0}
.pair-cards .pair-slot img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
.pair-cards .pair-slot .pair-empty{width:100%;height:100%;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#f0ebe3;border-radius:6px}
.pair-cards .pair-slot .pair-thumb{width:100%;aspect-ratio:3/4;overflow:hidden;background:#f0ebe3;border-radius:6px;display:flex;align-items:center;justify-content:center}
.pair-cards .pair-slot .pair-thumb img{width:100%;height:100%;object-fit:cover}
.pair-cards .pair-slot .pair-thumb .emoji{font-size:28px}
.pair-cards .pair-slot .pair-cap{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 卡片配对角标 */
.pair-badge{position:absolute;bottom:8px;right:8px;background:var(--pl);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px;z-index:2}
.pair-btn{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.05);color:#666;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;padding:0 6px}
.stat-num{font-size:20px;font-weight:700;color:var(--purple)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.stat-divider{width:1px;background:#eee}
.manage-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:8px 12px;background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.manage-bar .count{font-size:12px;color:var(--muted)}
.manage-actions{display:flex;gap:6px}
.manage-actions button{padding:6px 12px;border-radius:var(--rs);font-size:12px;border:none;cursor:pointer}
.btn-add{background:var(--tint2,#ede9fe);color:var(--purple);font-weight:600}
.user-bar{background:var(--card);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.user-bar .av{width:36px;height:36px;border-radius:50%;background:var(--tint2,#ede9fe);display:flex;align-items:center;justify-content:center;font-size:18px}
.user-bar .uname{font-size:14px;font-weight:600}
.user-bar .uinfo{font-size:11px;color:var(--muted)}
.badge-founder{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;margin-left:6px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-panel{background:var(--card);width:100%;max-width:480px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f0ebe3;flex-shrink:0}
.modal-hd h3{font-size:17px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:14px;background:#fafafa}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--pl);background:#fff}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.btn-main{width:100%;padding:14px;background:linear-gradient(135deg,var(--pl),var(--purple));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-main:active{opacity:.9}
.btn-sm{padding:6px 14px;border-radius:var(--rs);font-size:12px;border:none;cursor:pointer}
.upload-area{width:100%;min-height:140px;border:2px dashed var(--accent-border,#d4c5f9);border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--tint,#faf5ff);overflow:hidden}
.upload-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;font-size:13px;color:var(--muted)}
.upload-placeholder .big-icon{font-size:36px}

function supaGet(table,opts){
  var u=SUPABASE_URL+'/rest/v1/'+table+'?select=*';
  if(opts&&opts.order) u+='&order='+opts.order.replace(/\.desc$/,'')+(opts.asc===false||/\.desc$/.test(opts.order)?'.desc':'');
  if(opts&&opts.limit) u+='&limit='+opts.limit;
  if(opts&&opts.eq) for(var k in opts.eq) u+='&'+k+'=eq.'+encodeURIComponent(opts.eq[k]);
  if(opts&&opts['in']) for(var k in opts['in']) u+='&'+k+'=in.('+opts['in'][k].map(encodeURIComponent).join(',')+')';
  return fetch(u,{headers:{apikey:SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}}).then(function(r){ if(!r.ok) return {data:null,error:{message:'HTTP '+r.status}}; return r.json().then(function(d){ return {data:d instanceof Array?d:null,error:null} }) }).catch(function(e){ return {data:null,error:e} });
}
function supaInsert(table,data){
  return fetch(SUPABASE_URL+'/rest/v1/'+table,{method:'POST',headers:{apikey:SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){ if(r.ok) return {error:null,data:null}; return r.text().then(function(t){ return {error:{message:'HTTP '+r.status+': '+t}} }) }).catch(function(e){ return {error:e} });
}
function supaUpdate(table,filter,data){
  var u=SUPABASE_URL+'/rest/v1/'+table;
  var qs=[];
  for(var k in filter) qs.push(k+'=eq.'+encodeURIComponent(filter[k]));
  if(qs.length) u+='?'+qs.join('&');
  return fetch(u,{method:'PATCH',headers:{apikey:SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){ if(r.ok) return {error:null}; return r.text().then(function(t){ return {error:{message:'HTTP '+r.status+': '+t}} }) }).catch(function(e){ return {error:e} });
}
function supaDelete(table,filter){
  var u=SUPABASE_URL+'/rest/v1/'+table;
  var qs=[];
  for(var k in filter) qs.push(k+'=eq.'+encodeURIComponent(filter[k]));
  if(qs.length) u+='?'+qs.join('&');

async function compressImage(dataUrl, opts){
  opts=opts||{};
  var maxShort=opts.maxShort||720, quality=opts.quality||0.75, type=opts.type||'image/jpeg';
  return new Promise(function(resolve){
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.width, h=img.height;
        var short=Math.min(w,h), ratio=Math.min(1, maxShort/short);
        w=Math.round(w*ratio); h=Math.round(h*ratio);
        var canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        var ctx=canvas.getContext('2d');
        if(type==='image/jpeg'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL(type,quality));
      }catch(e){ resolve(dataUrl) }
    };
    img.onerror=function(){ resolve(dataUrl) };
    img.src=dataUrl;
  });
}

async function loadData(){
  groups=_cacheGet('groups');
  members=_cacheGet('members');
  users=_cacheGet('users');

  var needGroups=!groups, needMembers=!members, needUsers=!users;
  var staticPromises=[];
  if(needGroups) staticPromises.push(supaGet('groups',{order:'sort_order'}));
  if(needMembers) staticPromises.push(supaGet('members',{order:'sort_order'}));
  if(needUsers) staticPromises.push(supaGet('users'));

  var uid=localStorage.getItem('kcard_user_id');
  var dynamicPromises=[
    supaGet('invite_codes',{limit:1}).then(function(r){ return {data:(r.data&&r.data[0])||null} })
  ];
  if(uid) dynamicPromises.push(supaGet('records',{eq:{user_id:uid},order:'created_at.desc'}));
  else dynamicPromises.push(Promise.resolve({data:[]}));

  var staticResults=await Promise.all(staticPromises);
  var dynamicResults=await Promise.all(dynamicPromises);
  var si=0;
  if(needGroups){ groups=staticResults[si].data||[]; _cacheSet('groups',groups); si++ }
  if(needMembers){ members=staticResults[si].data||[]; _cacheSet('members',members); si++ }
  if(needUsers){ users=staticResults[si].data||[]; _cacheSet('users',users); si++ }

  var inviteData=dynamicResults[0].data;
  records=dynamicResults[1].data||[];
  if(!inviteData){
    var code='KARD-'+Math.random().toString(36).substring(2,6).toUpperCase();
    await supaInsert('invite_codes',{code:code,used:false});
    window._inviteCode=code;
  } else { window._inviteCode=inviteData.code }

  if(uid) currentUser=users.find(u=>u.id===uid)||null;
  if(!currentUser && users.length>0){ currentUser=users[0]; localStorage.setItem('kcard_user_id',currentUser.id) }
}

var _CARD_COLS='id,group_id,member_id,name,series,card_type,image_emoji,note,created_by,created_at';
async function loadCardImages(cardIds){
  if(!cardIds||!cardIds.length) return;
  var batchSize=8;
  for(var i=0;i<cardIds.length;i+=batchSize){
    var batch=cardIds.slice(i,i+batchSize);
    var url=SUPABASE_URL+'/rest/v1/cards?select=id,image_url&id=in.('+batch.join(',')+')';
    try{
      var resp=await fetch(url,{headers:{apikey:SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
      var data=await resp.json();
      if(Array.isArray(data)){
        data.forEach(function(c){
          var card=cards.find(function(x){return x.id===c.id});
          if(card) card.image_url=c.image_url;
        });
      }
    }catch(e){ console.warn('loadCardImages error',e) }
    render();
  }
}

  var myGid=getUserGroupId();
  var cUrl=SUPABASE_URL+'/rest/v1/cards?select='+_CARD_COLS+'&order=created_at.desc,id.desc&limit='+CARD_PAGE_SIZE+(myGid?'&group_id=eq.'+encodeURIComponent(myGid):'');

      var xUrl=SUPABASE_URL+'/rest/v1/cards?select='+_CARD_COLS+'&id=in.('+missingIds.map(encodeURIComponent).join(',')+')';

}

}

function _normVersion(name){
  var low=(name||'').toLowerCase();
  if(/rats[\s_-]?nest/.test(low)||low.indexOf('黄版')>-1) return 'rats nest';
  if(/\brev\b/.test(low)||low.indexOf('白版')>-1) return 'rev';
  if(/weverse/.test(low)) return 'weverse';
  if(/compact/.test(low)) return 'compact';
  if(/\bkit\b/.test(low)) return 'kit';
  return '';
}
function _extractSlotNum(name, version){
  var n=name||'';
  if(version){
    var esc=version.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    var re=new RegExp(esc+'[\s/\\-]*(\d+)','i');
    var m=n.match(re);
    if(m) return parseInt(m[1],10);
  }
  var all=n.match(/\b(\d+)\b/g);
  if(all&&all.length) return parseInt(all[all.length-1],10);
  return 0;
}
function _isPreciseSlotCard(name){
  var low=(name||'').toLowerCase();
  // target/us/eu/el/合照 等特典/合照卡，命名里没有明确编号，不算入标准图鉴进度
  if(/target|us\/eu|el特典|合照|特典/.test(low)) return false;
  var v=_normVersion(name);
  if(!v) return false;
  var num=_extractSlotNum(name, v);
  return num>0;
}
function matchOwnedSlots(sname,seriesCards){
  var ownedKeys={};
  seriesCards.forEach(function(c){
    var version=_normVersion(c.name);
    var num=_extractSlotNum(c.name, version);
    if(version && num>0) ownedKeys[version+'_'+num]=c;
  });
  return ownedKeys;
}

var _guideIdx={};
function initGuideSwiper(sname){
  var g=_ALBUM_GUIDES[sname]||[];
  _guideIdx[sname]=0;
  var dots=document.getElementById('guideDots_'+sname);
  if(!dots) return;
  dots.innerHTML='';
  for(var i=0;i<g.length;i++){
    var d=document.createElement('div');
    d.className='album-guide-dot'+(i===0?' active':'');
    dots.appendChild(d);
  }
  updateGuideNav(sname);
  var el=document.getElementById('guideSwiper_'+sname);
  if(!el) return;
  var ts=0;
  el.addEventListener('touchstart',function(e){ts=e.changedTouches[0].screenX;},{passive:true});
  el.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].screenX-ts;
    if(Math.abs(dx)>40) goGuideSlide(sname,dx<0?1:-1);
  },{passive:true});
}
function goGuideSlide(sname,dir){
  var g=_ALBUM_GUIDES[sname]||[];
  var idx=(_guideIdx[sname]||0)+dir;
  // g.length 是上传按钮这一张
  if(idx<0||idx>g.length) return;
  _guideIdx[sname]=idx;
  var track=document.getElementById('guideTrack_'+sname);
  if(track) track.style.transform='translateX(-'+(idx*100)+'%)';
  var dots=document.querySelectorAll('#guideDots_'+sname+' .album-guide-dot');
  dots.forEach(function(d,i){d.classList.toggle('active',i===idx)});
  updateGuideNav(sname);
  var prog=document.getElementById('guideProgress_'+sname);
  if(prog){
    var seriesCount=(window._currentSeriesCards||[]).length;
    if(idx===g.length){ prog.textContent=seriesCount+'张 · 上传图鉴 · 左右滑动切换'; }
    else { var item=g[idx]; prog.textContent=seriesCount+'张 · '+item.name+' · '+item.label+' · 左右滑动切换'; }
  }
}
function updateGuideNav(sname){
  var g=_ALBUM_GUIDES[sname]||[];
  var idx=_guideIdx[sname]||0;
  var prev=document.getElementById('btnPrev_'+sname);
  var next=document.getElementById('btnNext_'+sname);
  if(prev) prev.disabled=idx===0;
  if(next) next.disabled=idx===g.length;
}

  openModal('🤖 AI 录入',html);
  _formImgData='';
}

function parseAiInput(text){
  if(!text.trim()) return null;
  // 优先按行切分，否则按空格切分
  var tokens=text.trim().split(/[\n，,]+/).map(function(s){return s.trim()}).filter(Boolean);
  if(tokens.length===1) tokens=text.trim().split(/\s+/).filter(Boolean);

  var result={member:null,name:'',series:'',card_type:'',price:0,status:'',unknown:tokens.slice()};
  var myGid=getUserGroupId()||'seventeen';
  var myMembers=members.filter(function(m){return m.group_id===myGid});

  // 识别成员
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];
    var found=myMembers.find(function(m){return m.name===t || (m.aliases&&m.aliases.includes(t))});
    if(!found) found=myMembers.find(function(m){return m.name.indexOf(t)>=0 || t.indexOf(m.name)>=0});
    if(found){ result.member=found.id; result.unknown.splice(result.unknown.indexOf(t),1); break }
  }

  // 识别价格
  for(var i=0;i<result.unknown.length;i++){
    var t=result.unknown[i];
    var m=t.match(/(?:¥|￥)?(\d+(?:\.\d+)?)/);
    if(m){ result.price=parseFloat(m[1]); result.unknown.splice(i,1); i-- }
  }

  // 识别状态
  for(var i=0;i<result.unknown.length;i++){
    var t=result.unknown[i];
    var foundStatus=STATUSES.find(function(s){return s===t || t.indexOf(s)>=0});
    if(foundStatus){ result.status=foundStatus; result.unknown.splice(i,1); i-- }
  }

  if(!isCortisUser()){
    // 识别品类
    for(var i=0;i<result.unknown.length;i++){
      var t=result.unknown[i];
      var foundType=CARD_TYPES.find(function(ct){return ct===t || t.indexOf(ct)>=0});
      if(foundType){ result.card_type=foundType; result.unknown.splice(i,1); i-- }
    }
    // 剩下的：第一个是卡名，第二个是系列（如果有）
    if(result.unknown.length>0){ result.name=result.unknown[0]; result.unknown.shift() }
    if(result.unknown.length>0){ result.series=result.unknown[0]; result.unknown.shift() }
  } else {
    // CORTIS：剩下第一个就是卡名
    if(result.unknown.length>0){ result.name=result.unknown[0]; result.unknown.shift() }
  }

  // 默认值
  if(!result.status) result.status='已到手';
  if(!result.price) result.price=0;
  if(!result.card_type && !isCortisUser()) result.card_type='其他';
  return result;
}

  await doAiSave(parsed);

async function doAiSave(parsed){

  var cardData={
    id:cid,
    group_id:gid,
    member_id:parsed.member==='__team__'?null:parsed.member||null,
    name:parsed.name,

function toggleNewField(kind){
  var sel=document.getElementById(kind==='series'?'cardSeries':'cardType');
  var grp=document.getElementById(kind==='series'?'newSeriesGroup':'newTypeGroup');
  var inp=document.getElementById(kind==='series'?'newSeriesName':'newTypeName');
  grp.classList.toggle('hidden',sel.value!=='__new__');
  if(sel.value==='__new__') setTimeout(function(){inp.focus()},100);
}

function updateMemSel(){
  var gid=document.getElementById('cardGroup').value, s=document.getElementById('cardMember');

function previewCardImg(e){ var f=e.target.files[0]; if(!f) return; var reader=new FileReader(); reader.onload=async function(ev){ _formImgData=await compressImage(ev.target.result); document.getElementById('cardUpPlaceholder').classList.add('hidden'); var p=document.getElementById('cardUpPreview'); p.src=_formImgData; p.classList.remove('hidden') }; reader.readAsDataURL(f) }
function clearCardPreview(){ document.getElementById('cardImgInput').value=''; document.getElementById('cardUpPlaceholder').classList.remove('hidden'); var p=document.getElementById('cardUpPreview'); p.classList.add('hidden'); p.src=''; _formImgData='' }

function openRecordPanel(card){
  var m=members.find(x=>x.id===card.member_id); var mn=m?m.name:'';
  var gn=groups.find(g=>g.id===card.group_id);
  var html=`<div style="display:flex;gap:10px;align-items:center;padding:12px;background:var(--tint,#faf5ff);border-radius:8px;margin-bottom:14px"><div style="width:48px;height:48px;border-radius:6px;background:#f0ebe3;display:flex;align-items:center;justify-content:center;font-size:24px">${getEmoji(mn)}</div><div><div style="font-weight:600">${mn} · ${card.name}</div><div style="font-size:12px;color:var(--muted)">${gn?gn.name:''}${card.series?' · '+card.series:''}</div></div></div><div class="form-group"><label>💰 价格（元）</label><input type="number" id="recPrice" placeholder="如：200" min="0"></div><div class="form-group"><label>📦 状态</label><select id="recStatus">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="form-group"><label>📅 购买日期</label><input type="date" id="recDate"></div><div class="form-group"><label>📝 备注</label><textarea id="recNote" rows="2" placeholder="如：走代购"></textarea></div><button class="btn-main" onclick="saveRecord('${card.id}')">✅ 记入卡册</button>`;

async function saveRecord(cardId){
  var price=parseFloat(document.getElementById('recPrice').value)||0;
  var status=document.getElementById('recStatus').value;
  var date=document.getElementById('recDate').value;
  var note=document.getElementById('recNote').value.trim();
  if(isNaN(price)){ showToast('请填写价格'); return }
  var r=await supaInsert('records',{id:genId('r'),card_id:cardId,user_id:currentUser.id,price:price,status:status,buy_date:date,note:note});
  if(r.error){ showToast('添加失败: '+r.error.message); return }
  closeModal(); showToast('✅ 已记入卡册');
  await refreshCurrentData();
}

// ═══════════════════ 卡片点击 → 编辑或记入卡册 ═══════════════════
document.addEventListener('click',function(e){
  var el=e.target.closest('.card-item');
  if(!el) return;
  if(e.target.closest('.card-delete')||e.target.closest('.card-thumb')||e.target.closest('.card-edit')) return;
  if(!currentUser){ showToast('请先登录'); return }
  var cid=el.getAttribute('data-card-id');
  var rid=el.getAttribute('data-record-id');
  var card=cards.find(c=>c.id===cid);
  if(!card) return;
  if(rid){ editMyRecord(rid) }
  else { openRecordPanel(card) }
});

// ═══════════════════ 编辑卡册记录 ═══════════════════
function editMyRecord(rid){
  var rec=records.find(function(r){return r.id===rid});
  if(!rec) return;
  var card=cards.find(function(c){return c.id===rec.card_id});
  var cname=card?card.name:'未知卡';
  var isCortis=isCortisUser();
  var imgPreview='';
  if(card&&card.image_url){
    imgPreview=`<div style="text-align:center;margin-bottom:8px"><img src="${card.image_url}" style="max-width:100%;max-height:180px;border-radius:8px"><div style="font-size:11px;color:var(--muted);margin-top:4px">当前卡面</div></div>`;
  }
  var statusOpts=isCortis?`<option value="已到手"${rec.status==='已到手'?' selected':''}>✅ 已到手</option><option value="未发货"${rec.status==='未发货'?' selected':''}>📦 未发货</option>`:STATUSES.map(function(s){return `<option value="${s}"${rec.status===s?' selected':''}>${s}</option>`}).join('');
  var html=imgPreview+`<div class="form-group"><label>💰 价格（元）</label><input type="number" id="editRecPrice" value="${rec.price||0}" min="0"></div><div class="form-group"><label>📦 状态</label><select id="editRecStatus">${statusOpts}</select></div><button class="btn-main" onclick="saveMyRecord('${rid}')">💾 保存</button>`;
  openModal('✏️ 编辑 | '+cname,html);
}

async function saveMyRecord(rid){
  var price=parseFloat(document.getElementById('editRecPrice').value)||0;
  var status=document.getElementById('editRecStatus').value;
  if(isNaN(price)){ showToast('请填写价格'); return }
  await supaUpdate('records',{id:rid},{price:price,status:status});
  closeModal(); showToast('💾 已保存');
  await refreshCurrentData();
}

// ═══════════════════ 全局 ═══════════════════
document.addEventListener('click',function(e){ if(e.target.classList.contains('modal-overlay')&&e.target.id==='modal') closeModal() });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeModal(); closeLightbox() } });

// ═══════════════════ 启动 ═══════════════════
(async function init(){
  try{
    console.log('INIT START');
    await loadData();
    // 第一次打开：再跑一次 refresh 确保 cards/records 获取完整（跟点击刷新按钮走同一路径）
    await refreshCurrentData();
    console.log('LOADED groups=', groups.length, 'cards=', cards.length, 'records=', records.length, 'users=', users.length);
    render();
    console.log('RENDER DONE');
  }catch(err){
    console.error('INIT ERROR', err);
    document.getElementById('mainContent').innerHTML='<div style="text-align:center;padding:40px;color:var(--danger)">加载失败: '+err.message+'<br><br>请检查网络连接</div>';
  }
})();
</script>
