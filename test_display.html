<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卡册测试</title>
<style>
body{font-family:sans-serif;background:#f5f0eb;padding:20px}
.card{display:inline-block;background:#fff;border-radius:12px;padding:10px;margin:10px;width:200px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:180px;height:260px;object-fit:cover;border-radius:8px}
.card .name{font-weight:600;margin-top:8px}
.card .series{font-size:12px;color:#666}
</style>
</head>
<body>
<h1>mini2阿拉丁预售卡 - 数据库实际显示效果</h1>
<div id="cards"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL='https://neolxiocucigqrrgueim.supabase.co';
var SUPABASE_KEY='sb_publishable_WW39PvhU8H0FgEdCJk5YRg_eXN7oLIC';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function load(){
  var r = await sb.from('cards').select('*').eq('series','mini2阿拉丁预售卡').order('created_at');
  var cards = r.data || [];
  var html = '';
  cards.forEach(c => {
    var hasImg = c.image_url && c.image_url.length > 1000;
    html += '<div class="card">';
    if (hasImg) {
      html += '<img src="' + c.image_url + '" alt="">';
    } else {
      html += '<div style="width:180px;height:260px;background:#eee;display:flex;align-items:center;justify-content:center;border-radius:8px">无图</div>';
    }
    html += '<div class="name">' + c.name + '</div>';
    html += '<div class="series">' + c.member_id + '</div>';
    html += '</div>';
  });
  document.getElementById('cards').innerHTML = html;
}
load();
</script>
</body>
</html>
